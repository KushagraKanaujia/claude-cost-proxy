[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-cost-proxy"
version = "0.1.0"
description = "HTTP proxy for Claude Code with cost tracking, request logging, and semantic caching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "aiohttp>=3.9,<4"
]

[project.scripts]
claude-proxy = "claude_cost_proxy.server:main"
claude-proxy-setup = "claude_cost_proxy.setup:main"
claude-proxy-summary = "claude_cost_proxy.summary:main"

[tool.setuptools]
packages = ["claude_cost_proxy"]
